server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 3m;

  # DNS interno de Docker: resuelve "backend" en cada request (sobrevive reinicios del contenedor)
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://backend:3000;

  # API e imágenes: mismo origen que el frontend, sin CORS
  location /api/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /uploads/ { proxy_pass $api; }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

  # SPA: cualquier ruta del router vuelve a index.html
  location / { try_files $uri /index.html; }
}
