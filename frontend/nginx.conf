server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 3m;

  # API e imágenes: mismo origen que el frontend, sin CORS
  location /api/     { proxy_pass http://backend:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /uploads/ { proxy_pass http://backend:3000; }

  # SPA: cualquier ruta del router vuelve a index.html
  location / { try_files $uri /index.html; }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
}
